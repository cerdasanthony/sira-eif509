spring.application.name=sira
sira.portal-url=${SIRA_PORTAL_URL:http://localhost:5173}

# PostgreSQL es la fuente transaccional. Flyway crea el esquema y Hibernate
# solamente lo valida: una entidad mal mapeada hace fallar el arranque.
spring.datasource.url=${SIRA_POSTGRES_URL:jdbc:postgresql://localhost:5432/sira}
spring.datasource.username=${SIRA_POSTGRES_USER:sira}
spring.datasource.password=${SIRA_POSTGRES_PASSWORD:sira}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

# MongoDB conserva la bitacora documental del dominio.
spring.data.mongodb.uri=${SIRA_MONGODB_URI:mongodb://localhost:27017/sira}

# Actuator: solo salud y la version desplegada; nada mas, ni el indice de endpoints.
# La salud va sin detalles: no revela maquinas, versiones ni cadenas de conexion.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.discovery.enabled=false

# /actuator/info publica solo que commit esta corriendo, para que el despliegue
# se pueda verificar: un UP a secas tambien lo responde la instancia anterior
# mientras la plataforma reconstruye. El repositorio es publico, asi que el SHA
# no revela nada que no este ya en GitHub. La plataforma inyecta RENDER_GIT_COMMIT.
management.info.env.enabled=true
info.despliegue.commit=${RENDER_GIT_COMMIT:local}

# Base64 de al menos 32 bytes; sin valor se genera una clave efimera por arranque.
sira.jwt.secret=${SIRA_JWT_SECRET:}
sira.jwt.issuer=sira
sira.jwt.duration=PT15M
sira.demo.enabled=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Limites de tamano: una peticion enorme no debe agotar la memoria del contenedor.
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=256KB
spring.servlet.multipart.enabled=false

# Freno de fuerza bruta: 5 fallos por cuenta y origen dejan la cuenta 15 minutos en espera.
sira.ingreso.maximo-fallos=5
sira.ingreso.ventana=PT15M
sira.ingreso.espera=PT15M
springdoc.paths-to-match=/api/v1/**,/auth/login
springdoc.override-with-generic-response=false
spring.mvc.format.date=iso
spring.mvc.format.time=iso
sira.time-zone=America/Costa_Rica
