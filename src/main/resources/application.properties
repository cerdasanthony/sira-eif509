spring.application.name=sira

# PostgreSQL es la fuente transaccional. Flyway crea el esquema y Hibernate
# solamente lo valida: una entidad mal mapeada hace fallar el arranque.
spring.datasource.url=${SIRA_POSTGRES_URL:jdbc:postgresql://localhost:5432/sira}
spring.datasource.username=${SIRA_POSTGRES_USER:sira}
spring.datasource.password=${SIRA_POSTGRES_PASSWORD:sira}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

# MongoDB conserva la bitacora documental del dominio.
spring.data.mongodb.uri=${SIRA_MONGODB_URI:mongodb://localhost:27017/sira}

# Actuator: se expone solo el chequeo de salud (util para la CI y para el profe).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
