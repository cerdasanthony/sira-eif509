server.port=${PORT:8080}
sira.portal-url=${SIRA_PORTAL_URL:https://sira-spa.onrender.com}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=20m
spring.datasource.url=${SIRA_POSTGRES_URL:jdbc:postgresql://${SIRA_POSTGRES_HOST:localhost}:${SIRA_POSTGRES_PORT:5432}/${SIRA_POSTGRES_DB:sira}?sslmode=require}
spring.datasource.username=${SIRA_POSTGRES_USER}
spring.datasource.password=${SIRA_POSTGRES_PASSWORD}
spring.data.mongodb.uri=${SIRA_MONGODB_URI}
sira.jwt.secret=${SIRA_JWT_SECRET}
sira.cors.origins=${SIRA_CORS_ORIGINS}
sira.demo.enabled=false
spring.thymeleaf.cache=true
spring.jpa.properties.hibernate.format_sql=false
