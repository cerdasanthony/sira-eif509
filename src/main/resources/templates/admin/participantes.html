<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('Participantes')}"></head><body><header th:replace="~{admin/fragments :: navegacion}"></header><main>
<div class="title-row"><div><span class="eyebrow">ACOMPAÑAMIENTO</span><h1>Participantes</h1><p>Personas a su cargo y sus redes de apoyo.</p></div><a class="button" th:href="@{/admin/participantes/nuevo}">Nuevo participante</a></div>
<div th:replace="~{admin/fragments :: avisos}"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Nacimiento</th><th>Encargado (ID)</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="p : ${pagina.contenido}"><td th:text="${p.id}"></td><td th:text="${p.nombre}"></td><td th:text="${p.fechaNacimiento}"></td><td th:text="${p.encargadoId}"></td><td th:text="${p.activo ? 'Activo' : 'Inactivo'}"></td><td><a th:href="@{/admin/participantes/{id}/editar(id=${p.id})}">Editar</a></td></tr>
<tr th:if="${#lists.isEmpty(pagina.contenido)}"><td colspan="6">No hay participantes en esta página.</td></tr></tbody></table></div><nav th:replace="~{admin/fragments :: paginacion('/admin/participantes')}"></nav></main></body></html>
