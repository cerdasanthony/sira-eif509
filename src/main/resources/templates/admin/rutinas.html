<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('Rutinas')}"></head><body><header th:replace="~{admin/fragments :: navegacion('rutinas')}"></header><main id="contenido">
<div class="title-row"><div><span class="eyebrow">PASO A PASO</span><h1>Rutinas</h1><p>Diseñe un borrador y publíquelo para comenzar.</p></div><a class="button" th:href="@{/admin/rutinas/nueva}">Nueva rutina</a></div><div th:replace="~{admin/fragments :: avisos}"></div>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Rutina</th><th>Participante (ID)</th><th>Hora</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="r : ${pagina.contenido}"><td th:text="${r.id}"></td><td th:text="${r.nombre}"></td><td th:text="${r.participanteId}"></td><td th:text="${r.horaInicio}"></td><td><span class="badge" th:text="${r.estado}"></span></td><td><div class="actions" th:if="${r.estado.name() == 'BORRADOR'}"><a th:href="@{/admin/rutinas/{id}/editar(id=${r.id})}">Editar</a><form th:action="@{/admin/rutinas/{id}/publicar(id=${r.id})}" method="post"><button class="secondary">Publicar</button></form></div></td></tr><tr th:if="${#lists.isEmpty(pagina.contenido)}"><td colspan="6">No hay rutinas en esta página.</td></tr></tbody></table></div><nav th:replace="~{admin/fragments :: paginacion('/admin/rutinas')}"></nav></main></body></html>
