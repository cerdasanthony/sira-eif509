<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments :: head('Encargados')}"></head><body><header th:replace="~{admin/fragments :: navegacion}"></header><main>
<div class="title-row"><div><span class="eyebrow">RED DE APOYO</span><h1>Encargados</h1><p>Cuentas para registrar los avances desde casa.</p></div><a class="button" th:href="@{/admin/encargados/nuevo}">Nuevo encargado</a></div>
<div th:replace="~{admin/fragments :: avisos}"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Estado</th></tr></thead><tbody><tr th:each="u : ${pagina.contenido}"><td th:text="${u.id}"></td><td th:text="${u.nombre}"></td><td th:text="${u.correo}"></td><td th:text="${u.activo ? 'Activo' : 'Inactivo'}"></td></tr><tr th:if="${#lists.isEmpty(pagina.contenido)}"><td colspan="4">No hay encargados en esta página.</td></tr></tbody></table></div><nav th:replace="~{admin/fragments :: paginacion('/admin/encargados')}"></nav></main></body></html>
