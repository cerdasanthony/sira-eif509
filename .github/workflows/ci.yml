name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y correr pruebas
        run: ./gradlew build --no-daemon

      - name: Exigir pruebas reales de integracion sin omisiones
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          reports = list(pathlib.Path('build/test-results/test').glob('TEST-*IntegracionTest.xml'))
          assert reports, 'No hay reportes de integracion'
          for path in reports:
              suite = ET.parse(path).getroot()
              assert int(suite.get('tests', 0)) > 0, path
              assert int(suite.get('skipped', 0)) == 0, f'Pruebas omitidas: {path}'
          PY

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: build/reports/jacoco/test
          if-no-files-found: ignore
