name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Solo lectura del repositorio: el workflow no necesita escribir nada en GitHub.
permissions:
  contents: read

# Un despliegue a la vez; si llegan dos push seguidos, gana el ultimo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spa:
    name: Probar y compilar SPA
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spa/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Revisar vulnerabilidades de las dependencias publicadas
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Compilar y probar
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y correr pruebas
        run: ./gradlew build --no-daemon

      - name: Exigir cobertura minima en la capa de negocio
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Exigir pruebas reales de integracion sin omisiones
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          reports = list(pathlib.Path('build/test-results/test').glob('TEST-*IntegracionTest.xml'))
          assert reports, 'No hay reportes de integracion'
          for path in reports:
              suite = ET.parse(path).getroot()
              assert int(suite.get('tests', 0)) > 0, path
              assert int(suite.get('skipped', 0)) == 0, f'Pruebas omitidas: {path}'
          PY

      - name: Exigir al menos 40 pruebas en verde
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          total = fallos = omitidas = 0
          for path in pathlib.Path('build/test-results/test').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              total += int(suite.get('tests', 0))
              fallos += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
              omitidas += int(suite.get('skipped', 0))
          verdes = total - fallos - omitidas
          print(f'Pruebas: {total} totales, {verdes} en verde, {fallos} con fallo, {omitidas} omitidas')
          assert fallos == 0, 'Hay pruebas con fallo'
          assert verdes >= 40, f'Se requieren al menos 40 pruebas en verde y hay {verdes}'
          PY

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reporte-pruebas
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reporte-cobertura-jacoco
          path: build/reports/jacoco/test
          if-no-files-found: ignore

  desplegar:
    name: Desplegar a produccion
    needs: [ build, spa ]
    # Solo desde main, solo en push y solo si la verificacion completa paso.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: produccion
    steps:
      - name: Comprobar que los secretos del despliegue estan configurados
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_SPA: ${{ secrets.RENDER_DEPLOY_HOOK_SPA }}
          URL_SALUD: ${{ secrets.SIRA_HEALTH_URL }}
        run: |
          for nombre in HOOK_API HOOK_SPA URL_SALUD; do
            if [ -z "${!nombre}" ]; then
              echo "Falta el secreto $nombre en GitHub Secrets" >&2
              exit 1
            fi
          done

      - name: Pedir el despliegue de la API
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        # --fail-with-body corta el workflow si la plataforma responde con error.
        # La URL del hook es un secreto: nunca se imprime.
        run: curl --silent --show-error --fail-with-body --output /dev/null "$HOOK_API"

      - name: Pedir el despliegue de la SPA
        env:
          HOOK_SPA: ${{ secrets.RENDER_DEPLOY_HOOK_SPA }}
        run: curl --silent --show-error --fail-with-body --output /dev/null "$HOOK_SPA"

      - name: Esperar a que la version nueva responda UP
        env:
          URL_SALUD: ${{ secrets.SIRA_HEALTH_URL }}
          COMMIT: ${{ github.sha }}
        # No basta con que algo responda UP: mientras la plataforma reconstruye, la
        # instancia anterior sigue en pie y contestaria que todo esta bien. Por eso se
        # espera a que /actuator/info publique el commit que acaba de pasar la CI.
        # El plan gratuito reconstruye y despierta con lentitud: hasta 15 minutos.
        run: |
          URL_INFO="${URL_SALUD%/health}/info"
          for intento in $(seq 1 90); do
            salud=$(curl --silent --max-time 20 "$URL_SALUD" || true)
            info=$(curl --silent --max-time 20 "$URL_INFO" || true)
            case "$salud" in
              *'"status":"UP"'*)
                case "$info" in
                  *"$COMMIT"*)
                    echo "El commit $COMMIT respondio UP en el intento $intento"
                    exit 0
                    ;;
                esac
                ;;
            esac
            sleep 10
          done
          echo "::error::La version $COMMIT no llego a responder UP despues del despliegue" >&2
          echo "Ultima respuesta de salud: $salud" >&2
          echo "Ultima respuesta de info:  $info" >&2
          echo "Si info no trae el commit, revise que la plataforma inyecte RENDER_GIT_COMMIT." >&2
          exit 1
