services:
  postgres:
    image: postgres:16-alpine
    container_name: sira-postgres
    environment:
      POSTGRES_DB: sira
      POSTGRES_USER: sira
      POSTGRES_PASSWORD: sira
    ports:
      - "5432:5432"
    volumes:
      - sira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sira -d sira"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10-alpine
    container_name: sira-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command: -url=jdbc:postgresql://postgres:5432/sira -user=sira -password=sira -connectRetries=10 migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

  mongo:
    image: mongo:7
    container_name: sira-mongo
    environment:
      MONGO_INITDB_DATABASE: sira
    ports:
      - "27017:27017"
    volumes:
      - sira_mongo_data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sira_postgres_data:
  sira_mongo_data:
