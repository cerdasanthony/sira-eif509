# MongoDB se aprovisiona en Atlas. Configure los campos sync:false en Render.
services:
  - type: web
    name: sira-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SIRA_POSTGRES_HOST
        fromDatabase:
          name: sira-postgres
          property: host
      - key: SIRA_POSTGRES_PORT
        fromDatabase:
          name: sira-postgres
          property: port
      - key: SIRA_POSTGRES_DB
        fromDatabase:
          name: sira-postgres
          property: database
      - key: SIRA_POSTGRES_USER
        fromDatabase:
          name: sira-postgres
          property: user
      - key: SIRA_POSTGRES_PASSWORD
        fromDatabase:
          name: sira-postgres
          property: password
      - key: SIRA_MONGODB_URI
        sync: false
      - key: SIRA_JWT_SECRET
        sync: false
      - key: SIRA_CORS_ORIGINS
        sync: false
      - key: SIRA_PROFESIONAL_PASSWORD
        sync: false
      - key: SIRA_ENCARGADO_PASSWORD
        sync: false
  - type: web
    name: sira-spa
    runtime: static
    buildCommand: cd spa && npm ci && npm run build
    staticPublishPath: ./spa/dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # El sitio estatico no carga scripts de terceros. connect-src apunta al origen
      # real de la API: si cambia el dominio de la API, hay que actualizarlo aqui.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://sira-api-wzo1.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: sira-postgres
    plan: free
    region: oregon
    databaseName: sira
    user: sira
    postgresMajorVersion: '16'
